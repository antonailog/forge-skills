<!doctype html><html lang="zh"><meta charset="utf-8"><link rel="stylesheet" href="diagram.css">
<!-- 模板：把「…」换成真实内容，数字从代码和配置里取。 -->
<h1>用户流程</h1>
<div class="row">
  <div class="box"><b><span class="step">1</span>…</b><p>…</p></div>
  <div class="harrow">→</div>
  <div class="box"><b><span class="step">2</span>…</b><p>…</p></div>
  <div class="harrow">→</div>
  <div class="box"><b><span class="step">3</span>…</b><p>…</p></div>
  <div class="harrow">→</div>
  <div class="box key"><b><span class="step">4</span>…（拿到结果）</b><p>…</p></div>
</div>
<div class="arrow">岔路</div>
<div class="row">
  <div class="box side"><div class="tag">在 1 · …</div><p>…（看到什么、能做什么）</p></div>
  <div class="box side"><div class="tag">在 2 · …</div><p>…</p></div>
  <div class="box side"><div class="tag">在 3 · …</div><p>…</p></div>
</div>
</html>
